# The whole stack: FalkorDB, and the agent pointed at a repository you mount.
#
#   docker compose up -d falkordb
#   docker compose up agent                      # this repository, about syncRepository
#   NEXUS_REPO=/path/to/repo NEXUS_SYMBOL=foo docker compose up agent
#
# NEXUS_REPO is mounted read-write because a sync writes one lock file at
# .nexus/sync.lock to serialise syncs against the same graph. Nothing else in
# your repository is touched.
# Container names are left to Compose so that they are scoped to the project
# directory. Two checkouts of this repository would otherwise fight over one
# name, and a container that has merely been stopped still holds its name.
# The published ports are overridable for the same reason: FALKORDB_PORT lets a
# second checkout run beside the first instead of failing to bind 6379.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    image: nexus-mcp
    command:
      - packages/agent/dist/main.js
      - --symbol
      - ${NEXUS_SYMBOL:-syncRepository}
    environment:
      NEXUS_ROOT: /repo
      FALKORDB_URL: redis://falkordb:6379
      NEXUS_GRAPH: ${NEXUS_GRAPH:-nexus-docker}
      NEXUS_SALT: ${NEXUS_SALT:-docker}
      NEXUS_USER: ${NEXUS_USER:-local}
      NEXUS_AGENT: ${NEXUS_AGENT:-docker-agent}
      # Claude by default; stub runs the whole loop with no key and no network.
      NEXUS_PROVIDER: ${NEXUS_PROVIDER:-stub}
      NEXUS_MODEL: ${NEXUS_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    volumes:
      - ${NEXUS_REPO:-.}:/repo
    depends_on:
      falkordb:
        condition: service_healthy
    restart: "no"

volumes:
  falkordb-data:
